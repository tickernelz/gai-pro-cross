name: cross-platform mock verification

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest playwright
          python -m playwright install chromium
        shell: bash
      - name: Unit and integration tests (mock sandbox, no network, no real card)
        run: python -m pytest tests -q
        shell: bash
      - name: Sandbox self-test (drive the 5-step pipeline headlessly)
        run: python -m gai_pro selftest --data-dir artifacts/data
        shell: bash
      - name: Per-OS path probe
        run: python -m gai_pro probe --data-dir artifacts/data | tee artifacts/data/probe.txt
        shell: bash
      - name: Upload proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gai-pro-${{ matrix.os }}
          path: |
            artifacts/data/screenshots/**/*.png
            artifacts/data/console.log
            artifacts/data/probe.txt
          if-no-files-found: warn
