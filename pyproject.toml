[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gai-pro-cross"
version = "1.0.0"
description = "Cross-platform local console that mirrors the Google AI Pro trial automation flow"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["playwright>=1.40.0", "camoufox>=0.5.9"]
dev = ["pytest>=8"]

[project.scripts]
gai-pro-cross = "gai_pro.cli:main"

[tool.setuptools]
packages = ["gai_pro"]

[tool.setuptools.package-data]
gai_pro = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
